// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Required for Session Replay 1.0.0-alpha.x Compose capture: instruments
        // Compose bytecode at build time. Without it Compose UI is never recorded.
        classpath 'com.amplitude:session-replay-gradle-plugin:1.0.0-alpha.2'
    }
}

plugins {
    id 'com.android.application' version '8.12.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
} 